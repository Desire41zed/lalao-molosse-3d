name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build APK with PWA2APK
        uses: webintoapp/pwa2apk-action@v1.0.0
        with:
          web_url: 'https://desire41zed.github.io/lalao-molosse-3d/'
          app_name: 'Lalao Molosse 3D'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ./*.apk
